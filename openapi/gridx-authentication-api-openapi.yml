openapi: 3.2.0
info:
  title: GridX Enterprise Rate Platform Authentication API
  description: Partner/enterprise API for the GridX Enterprise Rate Platform.
  termsOfService: https://www.gridx.com/
  contact:
    name: GridX
    url: https://www.gridx.com/
  version: '1.0'
servers:
- url: https://pge-pe-api.gridx.com/v1
  description: PG&E production deployment
- url: https://pge-pe-api.gridx.com/stage/v1
  description: PG&E stage (test) deployment
security:
- bearerAuth: []
tags:
- name: Authentication
paths:
  /token:
    get:
      operationId: getToken
      tags:
      - Authentication
      summary: Obtain a JWT bearer token
      description: Returns a JWT bearer token (valid ~1 hour) used to authorize Customer Information and Usage requests. A separate token-authentication flow secures the OpenADR endpoints.
      responses:
        '200':
          description: A JWT token used as the Authorization bearer credential.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token obtained from the /token endpoint (expires ~1 hour).
